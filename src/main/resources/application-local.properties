spring.application.name=devsu-user
server.port=8095

# ===== Datasource H2 =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== H2 Console =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Logging =====
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ===== LOCK =====
# Redis
redis.host=redis
redis.port=6379
# Lock TTL en milisegundos
lock.ttl-millis=60000

# ===== Queue =====
# --- CONFIGURACIÓN GLOBAL DE KAFKA ---
spring.kafka.bootstrap-servers=127.0.0.1:9094

# --- PRODUCER (El que envía) ---
# Usamos String para la clave y JSON para el valor (el EventMessage)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- CONSUMER (El que escucha) ---
spring.kafka.consumer.group-id=unique-group-id-999
spring.kafka.consumer.auto-offset-reset=earliest

# IMPORTANTE: Aquí estaba tu error. La KEY debe ser StringDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Confianza para que el Consumer acepte los JSON del Producer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.ds.devsuuser.infraestructure.queue.dto.EventMessage