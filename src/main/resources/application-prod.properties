spring.application.name=devsu-user
server.port=${SERVER_PORT:8095}

# ===== Datasource (Postgres) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# ===== Lock (Redis) =====
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT:6379}
lock.ttl-millis=${LOCK_TTL_MILLIS:60000}

# ===== Logging =====
logging.level.root=INFO
logging.level.com.ds.devsuuser=INFO
